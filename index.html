<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mietwerk 2D</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --panel-2: #374151;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --ok: #34d399;
      --warn: #f59e0b;
      --bad: #f87171;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 560px 1fr;
      gap: 12px;
      padding: 12px;
      min-height: 100vh;
    }
    .left, .right { display: flex; flex-direction: column; gap: 10px; }
    .panel {
      background: var(--panel);
      border: 1px solid #4b5563;
      border-radius: 8px;
      padding: 10px;
    }
    h1, h2, h3 { margin: 0 0 8px; }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; }
    h3 { font-size: 15px; color: #dbeafe; }
    #cityCanvas { width: 100%; height: auto; border: 1px solid #6b7280; background: #0b1220; border-radius: 6px; display: block; }
    #cityCanvas {
      width: 100%;
      height: auto;
      border: 1px solid #6b7280;
      background: #0b1220;
      border-radius: 6px;
      display: block;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid #6b7280;
      border-radius: 6px;
      padding: 6px 9px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #4b5563; }
    .kpis { display: grid; grid-template-columns: repeat(2, minmax(150px, 1fr)); gap: 8px; }
    .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 6px; font-size: 13px; }
    .kpi strong { display: block; font-size: 15px; margin-top: 4px; }
    .scroll { max-height: 230px; overflow: auto; border: 1px solid #374151; border-radius: 6px; padding: 6px; background: #0f172a; font-size: 13px; }
    .item { border: 1px solid #374151; border-radius: 6px; padding: 6px; margin-bottom: 6px; background: #111827; }
    .item.selected { border-color: #60a5fa; box-shadow: inset 0 0 0 1px #60a5fa; }
    .kpis {
      display: grid;
      grid-template-columns: repeat(2, minmax(150px, 1fr));
      gap: 8px;
    }
    .kpi {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px;
      font-size: 13px;
    }
    .kpi strong { display: block; font-size: 15px; margin-top: 4px; }
    .scroll {
      max-height: 220px;
      overflow: auto;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 6px;
      background: #0f172a;
      font-size: 13px;
    }
    .item {
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 6px;
      background: #111827;
    }
    .muted { color: var(--muted); }
    .good { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    textarea {
      width: 100%; min-height: 85px; background: #0f172a; color: var(--text); border: 1px solid #4b5563;
      border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px;
    }
    .pill { display: inline-block; padding: 2px 6px; border: 1px solid #475569; border-radius: 999px; font-size: 11px; }
    @media (max-width: 1200px) { body { grid-template-columns: 1fr; } }
      width: 100%;
      min-height: 85px;
      background: #0f172a;
      color: var(--text);
      border: 1px solid #4b5563;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 12px;
    }
    @media (max-width: 1200px) {
      body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="left">
    <div class="panel">
      <h1>Mietwerk 2D</h1>
      <canvas id="cityCanvas" width="540" height="360"></canvas>
      <p class="muted">Klicke auf ein Objekt im Stadtplan für Details und Aktionen.</p>
    </div>

    <div class="panel">
      <h2>Spielsteuerung</h2>
      <div class="row">
        <button id="btnWeek">+1 Woche</button>
        <button id="btnMonth">+4 Wochen</button>
        <button id="btnCollect">Mieten einziehen</button>
        <button id="btnCredit">Kreditrate zahlen</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <button id="btnCreateProperty">Objekt erstellen</button>
        <button id="btnSave">Speichern</button>
        <button id="btnLoad">Laden</button>
        <button id="btnExport">Export JSON</button>
        <button id="btnImport">Import JSON</button>
      </div>
      <textarea id="importExportBox" placeholder="Export erscheint hier / Import JSON hier einfügen"></textarea>
    </div>

    <div class="panel">
      <h2>Log / Feed</h2>
      <div id="logList" class="scroll"></div>
    </div>
  </section>

  <section class="right">
    <div class="panel">
      <h2>Kennzahlen</h2>
      <div class="kpis">
        <div class="kpi">Zeit<strong id="kpiTime"></strong></div>
        <div class="kpi">Cash<strong id="kpiCash"></strong></div>
        <div class="kpi">Netto-Cashflow (letzter Monat)<strong id="kpiFlow"></strong></div>
        <div class="kpi">Belegungsquote<strong id="kpiOcc"></strong></div>
        <div class="kpi">Rücklagen<strong id="kpiReserve"></strong></div>
        <div class="kpi">Offene Aufgaben<strong id="kpiTasks"></strong></div>
      </div>
      <p id="gameStateLine" class="muted" style="margin-top:8px;"></p>
    </div>

    <div class="panel">
      <h2 id="propertyTitle">Kein Objekt ausgewählt</h2>
      <div id="propertyDetails" class="scroll"></div>
      <div class="row" style="margin-top:8px;">
        <button id="btnAddUnit">Einheit hinzufügen</button>
        <button id="btnAd">Inserat</button>
        <button id="btnRenovate">Renovieren</button>
        <button id="btnTask">Aufgabe erstellen</button>
        <button id="btnRaiseRent">Miete erhöhen</button>
      </div>
    </div>

    <div class="panel">
      <h2>Aufgabenliste</h2>
      <div id="taskList" class="scroll"></div>
    </div>
  </section>

<script>
(() => {
  const SAVE_KEY = 'mietwerk2d_save_v1';
  const game = {
    version: 1,
    week: 1,
    month: 1,
    cash: 120000,
    reserveBalance: 0,
    monthlyRentCollected: 0,
    creditPaidThisMonth: false,
    lastMonthSummary: { income: 0, expenses: 0, net: 0 },
    monthsWinningStreak: 0,
    selectedPropertyId: null,
    nextId: 100,
    properties: [],
    tasks: [],
    log: [],
    gameOver: false,
    victory: false
  };

  const el = {
    canvas: document.getElementById('cityCanvas'),
    ctx: document.getElementById('cityCanvas').getContext('2d'),
    logList: document.getElementById('logList'),
    taskList: document.getElementById('taskList'),
    propertyTitle: document.getElementById('propertyTitle'),
    propertyDetails: document.getElementById('propertyDetails'),
    gameStateLine: document.getElementById('gameStateLine'),
    box: document.getElementById('importExportBox'),
    kpiTime: document.getElementById('kpiTime'),
    kpiCash: document.getElementById('kpiCash'),
    kpiFlow: document.getElementById('kpiFlow'),
    kpiOcc: document.getElementById('kpiOcc'),
    kpiReserve: document.getElementById('kpiReserve'),
    kpiTasks: document.getElementById('kpiTasks'),
  };

  function gid() { return game.nextId++; }
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function roll(chance) { return Math.random() < chance; }
  function euro(v) { return `${Math.round(v).toLocaleString('de-DE')} €`; }

  function addLog(text, type = 'muted') {
    game.log.unshift({ week: game.week, text, type });
    if (game.log.length > 120) game.log.pop();
  }

  function initialState() {
    game.properties = [
      {
        id: gid(),
        name: 'Wohnblock Nord',
        x: 1,
        y: 1,
        value: 350000,
        condition: 74,
        fixedCosts: 1800,
        reserveMonthly: 700,
        credit: { remaining: 240000, rate: 1900, termMonths: 180 },
        units: [
          {
            id: gid(),
            label: '1A', rent: 950, deposit: 1900, wear: 32, isAdvertised: false,
            tenant: { name: 'Meier', satisfaction: 73, reliability: 89 }
          },
          {
            id: gid(),
            label: '1B', rent: 890, deposit: 1780, wear: 38, isAdvertised: false,
            tenant: { name: 'Kaya', satisfaction: 68, reliability: 76 }
          },
          {
            id: gid(),
            label: '2A', rent: 1020, deposit: 2040, wear: 40, isAdvertised: true,
            tenant: null
          }
        ]
      }
    ];
    game.selectedPropertyId = game.properties[0].id;
    game.tasks = [];
    game.log = [];
    addLog('Willkommen bei Mietwerk 2D. Starte mit +1 Woche.', 'good');
    addLog('Tipp: Inserat schalten und Mieter einziehen lassen.', 'muted');
  }

  function getSelectedProperty() {
    return game.properties.find(p => p.id === game.selectedPropertyId) || null;
  }

  function allUnits() {
    return game.properties.flatMap(p => p.units.map(u => ({ p, u })));
  }

  function occupancyRate() {
    const units = allUnits();
    if (!units.length) return 0;
    const occ = units.filter(x => x.u.tenant).length;
    return occ / units.length;
  }

  function createTask(taskData) {
    const task = {
      id: gid(),
      propertyId: taskData.propertyId,
      unitId: taskData.unitId || null,
      type: taskData.type,
      cost: taskData.cost,
      duration: taskData.duration,
      remainingWeeks: taskData.duration,
      priority: taskData.priority,
      status: 'offen',
      createdWeek: game.week,
      effect: taskData.effect || {}
    };
    game.tasks.push(task);
    addLog(`Neue Aufgabe: ${task.type} (Prio ${task.priority}, ${euro(task.cost)}).`, 'warn');
  }

  // Kritische Tick-Logik: Zeitfortschritt, Risiken, Aufgaben, Monatsabschluss
  function progressWeek() {
    if (game.gameOver || game.victory) return;
    game.week += 1;

    game.tasks.forEach(t => {
      if (t.status !== 'offen' && t.status !== 'in_arbeit') return;
      if (t.status === 'offen') t.status = 'in_arbeit';
      t.remainingWeeks -= 1;
      if (t.remainingWeeks <= 0) completeTask(t);
    });

    for (const p of game.properties) {
      p.condition = Math.max(0, p.condition - rand(0.1, 0.6));
      for (const u of p.units) {
        u.wear = Math.min(100, u.wear + rand(0.3, 1.0));
        if (u.tenant) {
          u.tenant.satisfaction = Math.max(0, u.tenant.satisfaction - rand(0.2, 1.0));
        } else if (u.isAdvertised && roll(0.25)) {
          autoRentUnit(p, u);
        }
      }

      const damageChance = Math.max(0.03, (100 - p.condition) / 900);
      if (roll(damageChance)) {
        p.condition = Math.max(0, p.condition - rand(2, 6));
        createTask({
          propertyId: p.id,
          type: 'Reparatur',
          cost: Math.round(rand(800, 2600)),
          duration: Math.ceil(rand(1, 3)),
          priority: ['Niedrig', 'Mittel', 'Hoch'][Math.floor(rand(0, 3))],
          effect: { conditionPlus: 8, satisfactionPlus: 3 }
        });
        addLog(`Schaden in ${p.name}: Reparatur nötig.`, 'bad');
      }
    }

    if (game.week % 4 === 0) finishMonth();
    evaluateState();
    autosave();
    render();
  }

  function completeTask(task) {
    task.status = 'erledigt';
    const p = game.properties.find(x => x.id === task.propertyId);
    if (!p) return;
    game.cash -= task.cost;
    if (task.effect.conditionPlus) p.condition = Math.min(100, p.condition + task.effect.conditionPlus);
    for (const u of p.units) {
      if (u.tenant && task.effect.satisfactionPlus) {
        u.tenant.satisfaction = Math.min(100, u.tenant.satisfaction + task.effect.satisfactionPlus);
      }
      if (task.effect.wearMinus) u.wear = Math.max(0, u.wear - task.effect.wearMinus);
    }
    addLog(`Aufgabe abgeschlossen: ${task.type} (${euro(task.cost)}).`, 'good');
  }

  function autoRentUnit(property, unit) {
    const names = ['Schulz', 'Nguyen', 'Krüger', 'Yilmaz', 'Bauer', 'Almeida', 'Klein'];
    unit.tenant = {
      name: names[Math.floor(rand(0, names.length))],
      satisfaction: Math.round(rand(55, 85)),
      reliability: Math.round(rand(60, 95))
    };
    unit.isAdvertised = false;
    game.cash += unit.deposit;
    addLog(`Neue Vermietung: ${property.name} / ${unit.label} an ${unit.tenant.name}.`, 'good');
  }

  function collectRents() {
    if (game.gameOver || game.victory) return;
    let total = 0;
    for (const p of game.properties) {
      for (const u of p.units) {
        if (!u.tenant) continue;
        const defaultRisk = (100 - u.tenant.reliability) / 150 + (100 - u.tenant.satisfaction) / 250;
        if (roll(defaultRisk)) {
          addLog(`Mietausfall bei ${p.name}/${u.label} (${u.tenant.name}).`, 'bad');
          u.tenant.satisfaction = Math.max(0, u.tenant.satisfaction - 8);
          createTask({
            propertyId: p.id, unitId: u.id, type: 'Mahnung',
            cost: 120, duration: 1, priority: 'Mittel', effect: { satisfactionPlus: -2 }
          });
        } else {
          total += u.rent;
          u.tenant.satisfaction = Math.min(100, u.tenant.satisfaction + 1);
        }
      }
    }
    game.cash += total;
    game.monthlyRentCollected += total;
    addLog(`Mieten eingezogen: ${euro(total)}.`, total > 0 ? 'good' : 'warn');
    autosave();
    render();
  }

  function payCreditRates() {
    let paid = 0;
    for (const p of game.properties) {
      if (p.credit.remaining > 0) {
        game.cash -= p.credit.rate;
        paid += p.credit.rate;
        p.credit.remaining = Math.max(0, p.credit.remaining - Math.max(0, p.credit.rate * 0.65));
        if (p.credit.termMonths > 0) p.credit.termMonths -= 1;
      }
    }
    game.creditPaidThisMonth = true;
    addLog(`Kreditraten bezahlt: ${euro(paid)}.`, paid > 0 ? 'warn' : 'muted');
    evaluateState();
    autosave();
    render();
  }

  function finishMonth() {
    let expenses = 0;
    for (const p of game.properties) {
      expenses += p.fixedCosts + p.reserveMonthly;
      game.reserveBalance += p.reserveMonthly;
    }

    if (!game.creditPaidThisMonth) {
      let autoPaid = 0;
      for (const p of game.properties) {
        if (p.credit.remaining > 0) {
          game.cash -= p.credit.rate;
          autoPaid += p.credit.rate;
          p.credit.remaining = Math.max(0, p.credit.remaining - Math.max(0, p.credit.rate * 0.5));
        }
      }
      expenses += autoPaid;
      addLog('Kreditrate wurde automatisch abgebucht (kein manueller Klick).', 'warn');
    }

    for (const p of game.properties) {
      for (const u of p.units) {
        if (!u.tenant) continue;
        const leaveChance = Math.max(0.02, (55 - u.tenant.satisfaction) / 300);
        if (u.tenant.satisfaction < 55 && roll(leaveChance)) {
          addLog(`${u.tenant.name} kündigt ${p.name}/${u.label} wegen Unzufriedenheit.`, 'bad');
          u.tenant = null;
          u.isAdvertised = false;
        }
      }
    }

    game.cash -= expenses;
    game.lastMonthSummary = {
      income: game.monthlyRentCollected,
      expenses,
      net: game.monthlyRentCollected - expenses
    };
    addLog(`Monatsabschluss M${game.month}: Einnahmen ${euro(game.lastMonthSummary.income)}, Ausgaben ${euro(expenses)}, Netto ${euro(game.lastMonthSummary.net)}.`, game.lastMonthSummary.net >= 0 ? 'good' : 'bad');

    game.month += 1;
    game.monthlyRentCollected = 0;
    game.creditPaidThisMonth = false;
  }

  function evaluateState() {
    const occ = occupancyRate();
    if (game.cash < 0) {
      game.gameOver = true;
      addLog('Game Over: Du bist bankrott.', 'bad');
    }
    if (game.cash > 250000 && occ >= 0.85) game.monthsWinningStreak += 1;
    else game.monthsWinningStreak = 0;

    if (game.monthsWinningStreak >= 3) {
      game.victory = true;
      addLog('Sieg: Finanzziele und Belegung über 3 Monate erreicht.', 'good');
    }
  }

  function selectedOrWarn() {
    const p = getSelectedProperty();
    if (!p) addLog('Bitte zuerst ein Objekt auf der Karte wählen.', 'warn');
    return p;
  }

  function renderMap() {
    const { ctx, canvas } = el;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cell = 90;

    for (let y = 0; y < 4; y++) {
      for (let x = 0; x < 6; x++) {
        ctx.strokeStyle = '#1f2937';
        ctx.strokeRect(12 + x * cell, 12 + y * cell, cell - 10, cell - 10);
      }
    }

    for (const p of game.properties) {
      const px = 12 + p.x * cell;
      const py = 12 + p.y * cell;
      ctx.fillStyle = p.id === game.selectedPropertyId ? '#2563eb' : '#334155';
      ctx.fillRect(px, py, cell - 10, cell - 10);
      ctx.strokeStyle = p.condition > 70 ? '#10b981' : p.condition > 40 ? '#f59e0b' : '#ef4444';
      ctx.lineWidth = 3;
      ctx.strokeRect(px + 1.5, py + 1.5, cell - 13, cell - 13);
      ctx.fillStyle = '#e5e7eb';
      ctx.font = '12px Arial';
      ctx.fillText(p.name.slice(0, 12), px + 6, py + 18);
      ctx.fillText(`${Math.round(p.condition)}%`, px + 6, py + 36);
      ctx.fillText(`${p.units.filter(u => u.tenant).length}/${p.units.length}`, px + 6, py + 52);
    }
  }

  function renderKPIs() {
    const openTasks = game.tasks.filter(t => t.status !== 'erledigt').length;
    el.kpiTime.textContent = `Woche ${game.week}, Monat ${game.month}`;
    el.kpiCash.textContent = euro(game.cash);
    el.kpiCash.className = game.cash >= 0 ? 'good' : 'bad';
    el.kpiFlow.textContent = euro(game.lastMonthSummary.net);
    el.kpiFlow.className = game.lastMonthSummary.net >= 0 ? 'good' : 'bad';
    el.kpiOcc.textContent = `${Math.round(occupancyRate() * 100)}%`;
    el.kpiReserve.textContent = euro(game.reserveBalance);
    el.kpiTasks.textContent = String(openTasks);
    el.kpiTasks.className = openTasks > 5 ? 'warn' : 'good';

    if (game.gameOver) el.gameStateLine.textContent = 'Status: GAME OVER';
    else if (game.victory) el.gameStateLine.textContent = 'Status: SIEG erreicht';
    else el.gameStateLine.textContent = `Siegbedingung: Cash > 250.000 €, Belegungsquote > 85% für 3 Monate (aktuell ${game.monthsWinningStreak}/3).`;
  }

  function renderProperty() {
    const p = getSelectedProperty();
    if (!p) {
      el.propertyTitle.textContent = 'Kein Objekt ausgewählt';
      el.propertyDetails.innerHTML = '<p class="muted">Bitte Objekt auf Karte anklicken.</p>';
      return;
    }
    el.propertyTitle.textContent = `${p.name} (${Math.round(p.condition)}% Zustand)`;

    const unitsHtml = p.units.map(u => {
      const tenant = u.tenant
        ? `${u.tenant.name} (Zufr. ${Math.round(u.tenant.satisfaction)}, Zuverl. ${Math.round(u.tenant.reliability)})`
        : '<span class="warn">Leerstand</span>';
      return `<div class="item">
        <strong>Einheit ${u.label}</strong> - Miete ${euro(u.rent)}, Abnutzung ${Math.round(u.wear)}%<br/>
        Mieter: ${tenant}<br/>
        Inserat: ${u.isAdvertised ? 'aktiv' : 'aus'}
        <div class="row" style="margin-top:4px;">
          <button onclick="window.mw.rentUnit(${p.id}, ${u.id})">Vermieten</button>
          <button onclick="window.mw.raiseUnitRent(${p.id}, ${u.id})">Miete +5%</button>
          <button onclick="window.mw.toggleAd(${p.id}, ${u.id})">Inserat umschalten</button>
        </div>
      </div>`;
    }).join('');

    el.propertyDetails.innerHTML = `
      <div class="item">Wert: ${euro(p.value)}<br/>Fixkosten/Monat: ${euro(p.fixedCosts)}<br/>Rücklage/Monat: ${euro(p.reserveMonthly)}<br/>Kredit: Rest ${euro(p.credit.remaining)}, Rate ${euro(p.credit.rate)}, Laufzeit ${p.credit.termMonths} Monate</div>
      <h3>Einheiten</h3>
      ${unitsHtml}
    `;
  }

  function renderTasks() {
    const openTasks = [...game.tasks].sort((a, b) => {
      const pa = { Hoch: 3, Mittel: 2, Niedrig: 1 }[a.priority] || 0;
      const pb = { Hoch: 3, Mittel: 2, Niedrig: 1 }[b.priority] || 0;
      return pb - pa;
    });
    if (!openTasks.length) {
      el.taskList.innerHTML = '<p class="muted">Keine Aufgaben vorhanden.</p>';
      return;
    }
    el.taskList.innerHTML = openTasks.map(t => {
      const p = game.properties.find(x => x.id === t.propertyId);
      return `<div class="item">
        <strong>${t.type}</strong> [${t.status}]<br/>
        Objekt: ${p ? p.name : 'n/a'} | Prio: ${t.priority}<br/>
        Dauer: ${t.remainingWeeks}W | Kosten: ${euro(t.cost)}
      </div>`;
    }).join('');
  }

  function renderLog() {
    el.logList.innerHTML = game.log.map(l => `<div class="item ${l.type}">[W${l.week}] ${l.text}</div>`).join('');
  }

  function render() {
    renderMap();
    renderKPIs();
    renderProperty();
    renderTasks();
    renderLog();
  }

  // Kritischer Save/Load-Block: kompletter State muss wiederherstellbar bleiben
  function autosave() {
    localStorage.setItem(SAVE_KEY, JSON.stringify(game));
  }

  function manualSave() {
    autosave();
    addLog('Manuell gespeichert.', 'good');
    render();
  }

  function manualLoad() {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return addLog('Kein Speicherstand vorhanden.', 'warn');
    try {
      const parsed = JSON.parse(raw);
      hydrate(parsed);
      addLog('Manuell geladen.', 'good');
      render();
    } catch {
      addLog('Laden fehlgeschlagen: Savegame defekt.', 'bad');
    }
  }

  function hydrate(parsed) {
    const keys = ['version','week','month','cash','reserveBalance','monthlyRentCollected','creditPaidThisMonth','lastMonthSummary','monthsWinningStreak','selectedPropertyId','nextId','properties','tasks','log','gameOver','victory'];
    for (const k of keys) game[k] = parsed[k];
  }

  function exportJSON() {
    el.box.value = JSON.stringify(game, null, 2);
    addLog('JSON-Export erstellt.', 'muted');
  }

  function importJSON() {
    try {
      const parsed = JSON.parse(el.box.value);
      hydrate(parsed);
      autosave();
      addLog('JSON-Import erfolgreich.', 'good');
      render();
    } catch {
      addLog('Import fehlgeschlagen: ungültiges JSON.', 'bad');
    }
  }

  function addProperty() {
    const name = prompt('Name des neuen Objekts:', `Objekt ${game.properties.length + 1}`);
    if (!name) return;
    const used = new Set(game.properties.map(p => `${p.x},${p.y}`));
    let x = 0, y = 0;
    outer: for (let yy = 0; yy < 4; yy++) {
      for (let xx = 0; xx < 6; xx++) {
        if (!used.has(`${xx},${yy}`)) { x = xx; y = yy; break outer; }
      }
    }
    const p = {
      id: gid(), name, x, y,
      value: 240000, condition: 80,
      fixedCosts: 1200, reserveMonthly: 500,
      credit: { remaining: 160000, rate: 1250, termMonths: 180 },
      units: []
    };
    game.properties.push(p);
    game.selectedPropertyId = p.id;
    addLog(`Neues Objekt erstellt: ${name}.`, 'good');
    autosave(); render();
  }

  function addUnit() {
    const p = selectedOrWarn();
    if (!p) return render();
    const label = prompt('Label der Einheit (z.B. 3C):', `${p.units.length + 1}A`);
    if (!label) return;
    const rent = Number(prompt('Monatsmiete in €:', '900'));
    if (!Number.isFinite(rent) || rent <= 0) return addLog('Ungültige Miete.', 'bad');
    p.units.push({ id: gid(), label, rent, deposit: rent * 2, wear: 28, isAdvertised: false, tenant: null });
    addLog(`Einheit ${label} zu ${p.name} hinzugefügt.`, 'good');
    autosave(); render();
  }

  function rentUnit(propertyId, unitId) {
    const p = game.properties.find(x => x.id === propertyId);
    const u = p?.units.find(x => x.id === unitId);
    if (!u) return;
    if (u.tenant) return addLog('Einheit ist bereits vermietet.', 'warn');
    const name = prompt('Mietername:', 'Neuer Mieter');
    if (!name) return;
    u.tenant = { name, satisfaction: 70, reliability: Math.round(rand(55, 95)) };
    u.isAdvertised = false;
    game.cash += u.deposit;
    addLog(`${name} zieht in ${p.name}/${u.label} ein. Kaution ${euro(u.deposit)}.`, 'good');
    autosave(); render();
  }

  function raiseUnitRent(propertyId, unitId) {
    const p = game.properties.find(x => x.id === propertyId);
    const u = p?.units.find(x => x.id === unitId);
    if (!u) return;
    const old = u.rent;
    u.rent = Math.round(u.rent * 1.05);
    if (u.tenant) {
      u.tenant.satisfaction = Math.max(0, u.tenant.satisfaction - rand(5, 12));
      if (u.tenant.satisfaction < 40 && roll(0.2)) {
        addLog(`${u.tenant.name} kündigt nach Mieterhöhung ${p.name}/${u.label}.`, 'bad');
        u.tenant = null;
      }
    }
    addLog(`Miete erhöht: ${p.name}/${u.label} ${euro(old)} -> ${euro(u.rent)}.`, 'warn');
    autosave(); render();
  }

  function toggleAd(propertyId, unitId) {
    const p = game.properties.find(x => x.id === propertyId);
    const u = p?.units.find(x => x.id === unitId);
    if (!u || u.tenant) return addLog('Inserat nur für leere Einheiten.', 'warn');
    u.isAdvertised = !u.isAdvertised;
    addLog(`Inserat für ${p.name}/${u.label}: ${u.isAdvertised ? 'aktiv' : 'inaktiv'}.`, 'muted');
    autosave(); render();
  }

  function renovateProperty() {
    const p = selectedOrWarn();
    if (!p) return render();
    const cost = Math.round(10000 + p.units.length * 1200);
    if (game.cash < cost) return addLog(`Zu wenig Cash für Renovierung (${euro(cost)}).`, 'bad');
    game.cash -= cost;
    p.condition = Math.min(100, p.condition + 18);
    p.units.forEach(u => {
      u.wear = Math.max(0, u.wear - 22);
      if (u.tenant) u.tenant.satisfaction = Math.min(100, u.tenant.satisfaction + 7);
    });
    createTask({
      propertyId: p.id,
      type: 'Renovierung',
      cost: Math.round(cost * 0.15),
      duration: 2,
      priority: 'Mittel',
      effect: { conditionPlus: 7, wearMinus: 10, satisfactionPlus: 4 }
    });
    addLog(`Renovierung gestartet in ${p.name}: Direktkosten ${euro(cost)}.`, 'good');
    autosave(); render();
  }

  function createManualTask() {
    const p = selectedOrWarn();
    if (!p) return render();
    const type = prompt('Task-Typ (Reparatur/Renovierung/Besichtigung/Mahnung/Verwaltung):', 'Verwaltung') || 'Verwaltung';
    const cost = Number(prompt('Kosten in €:', '500'));
    const duration = Number(prompt('Dauer in Wochen:', '1'));
    const priority = prompt('Priorität (Niedrig/Mittel/Hoch):', 'Mittel') || 'Mittel';
    if (!Number.isFinite(cost) || !Number.isFinite(duration)) return addLog('Ungültige Task-Werte.', 'bad');
    createTask({ propertyId: p.id, type, cost, duration, priority, effect: { satisfactionPlus: 2 } });
    autosave(); render();
  }

  function mapClick(evt) {
    const rect = el.canvas.getBoundingClientRect();
    const x = evt.clientX - rect.left;
    const y = evt.clientY - rect.top;
    const cell = 90;
    for (const p of game.properties) {
      const px = 12 + p.x * cell;
      const py = 12 + p.y * cell;
      if (x >= px && x <= px + (cell - 10) && y >= py && y <= py + (cell - 10)) {
        game.selectedPropertyId = p.id;
        render();
        break;
      }
    }
  }

  function bind() {
    document.getElementById('btnWeek').onclick = () => progressWeek();
    document.getElementById('btnMonth').onclick = () => { for (let i = 0; i < 4; i++) progressWeek(); };
    document.getElementById('btnCollect').onclick = collectRents;
    document.getElementById('btnCredit').onclick = payCreditRates;
    document.getElementById('btnCreateProperty').onclick = addProperty;
    document.getElementById('btnSave').onclick = manualSave;
    document.getElementById('btnLoad').onclick = manualLoad;
    document.getElementById('btnExport').onclick = exportJSON;
    document.getElementById('btnImport').onclick = importJSON;
    document.getElementById('btnAddUnit').onclick = addUnit;
    document.getElementById('btnAd').onclick = () => {
      const p = selectedOrWarn();
      if (!p) return render();
      const empty = p.units.find(u => !u.tenant);
      if (!empty) return addLog('Keine freie Einheit vorhanden.', 'warn');
      empty.isAdvertised = true;
      addLog(`Inserat geschaltet für ${p.name}/${empty.label}.`, 'muted');
      autosave(); render();
    };
    document.getElementById('btnRenovate').onclick = renovateProperty;
    document.getElementById('btnTask').onclick = createManualTask;
    document.getElementById('btnRaiseRent').onclick = () => {
      const p = selectedOrWarn();
      if (!p) return render();
      const occupied = p.units.find(u => u.tenant);
      if (!occupied) return addLog('Keine vermietete Einheit gefunden.', 'warn');
      raiseUnitRent(p.id, occupied.id);
    };
    el.canvas.addEventListener('click', mapClick);
  }

  window.mw = { rentUnit, raiseUnitRent, toggleAd };

  function boot() {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      try { hydrate(JSON.parse(raw)); }
      catch { initialState(); }
    } else {
      initialState();
      autosave();
    }
    bind();
    render();
  }

  boot();
})();
</script>
</body>
</html>
